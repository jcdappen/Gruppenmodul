<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gruppen – Gemeinde Konkordia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.25rem;
      font-size: 1.75rem;
    }

    #updated {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin-bottom: 2rem;
    }

    #search {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 2rem;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card h2 {
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .card p {
      font-size: 0.875rem;
      color: #444;
      flex: 1;
    }

    .leaders {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .leader {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #333;
    }

    .leader img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .leader .initials {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #6a9ec5;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card a.homepage {
      font-size: 0.8rem;
      color: #2563eb;
      text-decoration: none;
      margin-top: auto;
    }
    .card a.homepage:hover { text-decoration: underline; }

    #no-results {
      text-align: center;
      color: #888;
      margin-top: 3rem;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Unsere Gruppen</h1>
  <p id="updated"></p>
  <input id="search" type="search" placeholder="Gruppe suchen …" />
  <div id="grid"></div>
  <p id="no-results">Keine Gruppen gefunden.</p>

  <script>
    async function load() {
      const res  = await fetch('data/gruppen.json');
      const json = await res.json();

      if (json.generatedAt) {
        const d = new Date(json.generatedAt);
        document.getElementById('updated').textContent =
          'Stand: ' + d.toLocaleString('de-DE');
      }

      const groups = json.groups ?? [];
      render(groups);

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        render(groups.filter(g =>
          g.name.toLowerCase().includes(q) ||
          (g.description ?? '').toLowerCase().includes(q)
        ));
      });
    }

    function render(groups) {
      const grid = document.getElementById('grid');
      const none = document.getElementById('no-results');
      grid.innerHTML = '';

      if (groups.length === 0) {
        none.style.display = 'block';
        return;
      }
      none.style.display = 'none';

      for (const g of groups) {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('h2');
        title.textContent = g.name;
        card.appendChild(title);

        if (g.description) {
          const desc = document.createElement('p');
          desc.textContent = g.description;
          card.appendChild(desc);
        }

        if (g.leaders && g.leaders.length > 0) {
          const leadersEl = document.createElement('div');
          leadersEl.className = 'leaders';
          for (const l of g.leaders) {
            const lEl = document.createElement('div');
            lEl.className = 'leader';
            if (l.imageUrl) {
              const img = document.createElement('img');
              img.src = l.imageUrl;
              img.alt = `${l.firstName} ${l.lastName}`;
              img.loading = 'lazy';
              lEl.appendChild(img);
            } else {
              const ini = document.createElement('div');
              ini.className = 'initials';
              ini.textContent = (l.firstName?.[0] ?? '') + (l.lastName?.[0] ?? '');
              lEl.appendChild(ini);
            }
            const name = document.createElement('span');
            name.textContent = `${l.firstName} ${l.lastName}`;
            lEl.appendChild(name);
            leadersEl.appendChild(lEl);
          }
          card.appendChild(leadersEl);
        }

        if (g.publicUrl) {
          const link = document.createElement('a');
          link.className = 'homepage';
          link.href = g.publicUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Zur Gruppenpage →';
          card.appendChild(link);
        }

        grid.appendChild(card);
      }
    }

    load().catch(err => {
      document.getElementById('grid').textContent = 'Fehler beim Laden der Gruppen.';
      console.error(err);
    });
  </script>
</body>
</html>
