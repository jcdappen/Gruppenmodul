<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gruppen – Gemeinde Konkordia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rot:         #bb2232;
      --rot-dunkel:  #8f1926;
      --rot-hell:    #f9eced;
      --grau-dunkel: #3a3a3a;
      --grau-mittel: #717171;
      --grau-hell:   #f0f0f0;
      --grau-border: #e2e2e2;
      --weiss:       #ffffff;
      --radius-card: 16px;
      --radius-btn:  50px;
      --shadow:      0 2px 12px rgba(0,0,0,0.09);
      --shadow-hover:0 6px 24px rgba(0,0,0,0.14);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Source Sans 3', Arial, sans-serif;
      background: #fafafa;
      color: var(--grau-dunkel);
      font-size: 15px;
      line-height: 1.5;
    }

    /* ── Tab-Navigation ───────────────────────────── */
    #bereiche {
      display: flex;
      gap: 0.5rem;
      padding: 1.25rem 1rem 0;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--grau-border);
      background: var(--weiss);
    }

    .bereich-btn {
      padding: 0.55rem 1.2rem;
      background: transparent;
      border: 2px solid var(--grau-border);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--grau-mittel);
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      position: relative;
      bottom: -2px;
    }

    .bereich-btn:hover {
      color: var(--rot);
      background: var(--rot-hell);
    }

    .bereich-btn.active {
      color: var(--rot);
      border-color: var(--grau-border);
      border-bottom-color: var(--weiss);
      background: var(--weiss);
      font-weight: 600;
    }

    /* ── Gruppen-Grid ─────────────────────────────── */
    #gruppen {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
      gap: 1.25rem;
      padding: 1.5rem 1rem;
    }

    .gruppe-card {
      background: var(--weiss);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.25s, transform 0.25s;
    }

    .gruppe-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
    }

    .gruppe-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: var(--rot-hell);
    }

    .gruppe-body {
      padding: 1.1rem 1.25rem 1.3rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .gruppe-name {
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--grau-dunkel);
      line-height: 1.2;
    }

    .gruppe-desc {
      font-size: 0.9rem;
      color: var(--grau-mittel);
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .gruppe-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.45rem 1.1rem;
      font-family: 'Source Sans 3', Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border-radius: var(--radius-btn);
      border: 2px solid transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .btn-primary {
      background: var(--rot);
      color: var(--weiss);
    }

    .btn-primary:hover {
      background: var(--rot-dunkel);
    }

    .btn-outline {
      background: transparent;
      color: var(--rot);
      border-color: var(--rot);
    }

    .btn-outline:hover {
      background: var(--rot-hell);
    }

    /* ── Leer-Zustand ─────────────────────────────── */
    #leer {
      padding: 2.5rem 1rem;
      text-align: center;
      color: var(--grau-mittel);
      font-size: 0.9rem;
      display: none;
    }

    /* ── Lade-Indikator ───────────────────────────── */
    #laden {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--grau-mittel);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <nav id="bereiche"></nav>
  <div id="gruppen"></div>
  <p id="leer">Keine Gruppen vorhanden.</p>
  <p id="laden">Wird geladen …</p>

  <script>
    const BASE = 'https://jcdappen.github.io/Gruppenmodul';
    const params = new URLSearchParams(location.search);
    const vParam = (params.get('v') || '').trim().toLowerCase();

    function norm(s) {
      return s.toLowerCase()
        .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
        .replace(/[^a-z0-9]/g, '');
    }

    async function main() {
      const dataUrl = location.hostname === 'localhost' || location.protocol === 'file:'
        ? 'data/gruppen.json'
        : `${BASE}/data/gruppen.json`;

      const res = await fetch(dataUrl);
      if (!res.ok) throw new Error('Daten konnten nicht geladen werden.');
      const { groups } = await res.json();

      document.getElementById('laden').style.display = 'none';

      // Visionsbereich finden
      const vb = groups.find(g =>
        norm(g.name).includes(norm(vParam)) ||
        norm(vParam).includes(norm(g.name))
      );

      if (!vb) {
        zeigeLeer('Visionsbereich nicht gefunden.');
        return;
      }

      // Bereiche = direkte Kinder des Visionsbereichs
      const bereiche = groups.filter(g => (g.parentGroupIds || []).includes(vb.id));

      if (bereiche.length === 0) {
        zeigeLeer('Keine Bereiche vorhanden.');
        return;
      }

      // Navigation aufbauen
      const nav = document.getElementById('bereiche');
      bereiche.forEach((b, i) => {
        const btn = document.createElement('button');
        btn.className = 'bereich-btn' + (i === 0 ? ' active' : '');
        btn.textContent = b.name;
        btn.dataset.id = b.id;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.bereich-btn').forEach(x => x.classList.remove('active'));
          btn.classList.add('active');
          zeigeGruppen(b.id, groups);
        });
        nav.appendChild(btn);
      });

      // Ersten Bereich anzeigen
      zeigeGruppen(bereiche[0].id, groups);
    }

    function zeigeGruppen(bereichId, groups) {
      const untergruppen = groups.filter(g => (g.parentGroupIds || []).includes(bereichId));
      const grid = document.getElementById('gruppen');
      grid.innerHTML = '';

      if (untergruppen.length === 0) {
        zeigeLeer('Keine Gruppen in diesem Bereich.');
        return;
      }
      document.getElementById('leer').style.display = 'none';

      untergruppen.forEach(g => {
        const card = document.createElement('div');
        card.className = 'gruppe-card';

        // Bild
        const img = document.createElement('img');
        img.className = 'gruppe-img';
        img.alt = g.name;
        img.loading = 'lazy';

        const localImg = g.localImage
          ? (location.hostname === 'localhost' || location.protocol === 'file:'
              ? g.localImage
              : `${BASE}/${g.localImage}`)
          : null;
        const fallback = location.hostname === 'localhost' || location.protocol === 'file:'
          ? 'assets/images/fallback.svg'
          : `${BASE}/assets/images/fallback.svg`;

        img.src = localImg || fallback;
        img.onerror = () => { img.src = fallback; img.onerror = null; };
        card.appendChild(img);

        // Inhalt
        const body = document.createElement('div');
        body.className = 'gruppe-body';

        const name = document.createElement('div');
        name.className = 'gruppe-name';
        name.textContent = g.name;
        body.appendChild(name);

        if (g.description) {
          const desc = document.createElement('p');
          desc.className = 'gruppe-desc';
          desc.textContent = g.description;
          body.appendChild(desc);
        }

        const actions = document.createElement('div');
        actions.className = 'gruppe-actions';

        if (g.publicUrl) {
          const link = document.createElement('a');
          link.className = 'btn btn-primary';
          link.href = g.publicUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Mehr erfahren';
          actions.appendChild(link);
        }

        body.appendChild(actions);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    function zeigeLeer(msg) {
      const el = document.getElementById('leer');
      el.textContent = msg;
      el.style.display = 'block';
    }

    main().catch(err => {
      document.getElementById('laden').style.display = 'none';
      zeigeLeer('Fehler beim Laden der Gruppen.');
      console.error(err);
    });

    // ── Auto-Resize: Höhe an Eltern-Seite melden ──
    function meldeHoehe() {
      const h = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: 'gidk-resize', height: h }, '*');
    }

    // Nach jedem Render und bei Fenstergrößenänderung melden
    const resizeObserver = new ResizeObserver(meldeHoehe);
    resizeObserver.observe(document.body);
    window.addEventListener('resize', meldeHoehe);
  </script>

</body>
</html>
